<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFS AI Chatbot</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI;
}

body{
  height:100vh;
  background:#eef2f7;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* MAIN CONTAINER */

.chat-container{
  width:430px;
  height:740px;
  background:white;
  border-radius:30px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,0.15);
  display:flex;
  flex-direction:column;
}

/* HEADER */

.chat-header{
  background:#312e81;
  color:white;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.chat-header h2{
  font-size:20px;
  font-weight:600;
}

.chat-header span{
  font-size:22px;
  cursor:pointer;
}

/* CHAT AREA */

.chat-box{
  flex:1;
  padding:20px;
  overflow-y:auto;
  background:#f7f7f7;
}

/* DATE */

.date{
  text-align:center;
  color:gray;
  font-size:13px;
  margin-bottom:20px;
}

/* MESSAGE */

.msg{
  max-width:80%;
  padding:14px;
  margin-bottom:15px;
  border-radius:18px;
  line-height:1.5;
  font-size:15px;
  animation:fadeIn 0.3s ease;
  display:flex;
  gap:10px;
}

/* BOT MESSAGE */

.bot{
  background:white;
  color:#333;
  border-top-left-radius:5px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

/* USER MESSAGE */

.user{
  background:#56d9ff;
  color:white;
  margin-left:auto;
  border-top-right-radius:5px;
}

/* BOT EMOJI */

.bot-avatar{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  background:linear-gradient(135deg,#3b82f6,#9333ea);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  color:white;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

/* MESSAGE TEXT */
.msg-text{
  white-space: pre-line;
}
/* INPUT AREA */

.chat-input{
  display:flex;
  align-items:center;
  padding:15px;
  background:white;
  border-top:1px solid #eee;
}

.chat-input input{
  flex:1;
  border:none;
  outline:none;
  padding:14px;
  font-size:15px;
  border-radius:30px;
  background:#f1f5f9;
}

.send-btn{
  width:50px;
  height:50px;
  margin-left:10px;
  border:none;
  border-radius:50%;
  background:#312e81;
  color:white;
  font-size:20px;
  cursor:pointer;
  transition:0.2s;
}

.send-btn:hover{
  transform:scale(1.08);
}

/* TYPING EFFECT */

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  padding-top:10px;
}

.typing span{
  width:8px;
  height:8px;
  background:#999;
  border-radius:50%;
  animation:bounce 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:0.2s;
}

.typing span:nth-child(3){
  animation-delay:0.4s;
}

/* ANIMATIONS */

@keyframes bounce{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-5px);
  }
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

</style>
</head>

<body>

<div class="chat-container">

  <!-- HEADER -->

  <div class="chat-header">
    <span>←</span>
    <h2>AFS Assistant</h2>
    <span>⚙</span>
  </div>

  <!-- CHAT AREA -->

  <div class="chat-box" id="chatBox">

    <div class="date">
      Today
    </div>

    <!-- FIRST BOT MESSAGE -->

    <div class="msg bot">

      <div class="bot-avatar">
        🤖
      </div>

      <div class="msg-text">
        Hello 👋 <br>
        Welcome to AFS Diner!
      </div>

    </div>

  </div>

  <!-- INPUT -->

  <div class="chat-input">

    <input
      type="text"
      id="input"
      placeholder="Type a message..."
    >

    <button class="send-btn" onclick="send()">
      ➤
    </button>

  </div>

</div>

<script>

let input = document.getElementById("input");
let chatBox = document.getElementById("chatBox");

function send(){

  let text = input.value.trim();

  if(text === "") return;

  // USER MESSAGE

  chatBox.innerHTML += `
  
    <div class="msg user">

      <div class="msg-text">
        ${text}
      </div>

    </div>

  `;

  chatBox.scrollTop = chatBox.scrollHeight;

  input.value = "";

  // FETCH TO FLASK

  fetch("/chat",{

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({
      message:text
    })

  })

  .then(res => res.json())

  .then(data => {

    // TYPING EFFECT

    let typing = document.createElement("div");

    typing.className = "msg bot";

    typing.innerHTML = `

      <div class="bot-avatar">
        🤖
      </div>

      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>

    `;

    chatBox.appendChild(typing);

    chatBox.scrollTop = chatBox.scrollHeight;

    setTimeout(() => {

      typing.remove();

      // BOT MESSAGE

      chatBox.innerHTML += `

        <div class="msg bot">

          <div class="bot-avatar">
            🤖
          </div>

          <div class="msg-text">
            ${data.reply}
          </div>

        </div>

      `;

      chatBox.scrollTop = chatBox.scrollHeight;

    },800);

  })

  .catch(() => {

    chatBox.innerHTML += `

      <div class="msg bot">

        <div class="bot-avatar">
          ⚠
        </div>

        <div class="msg-text">
          Server Error
        </div>

      </div>

    `;

  });

}

/* ENTER KEY */

input.addEventListener("keydown", function(event){

  if(event.key === "Enter"){
    send();
  }

});

</script>

</body>
</html>
